<svg viewBox="0 0 1300 1500" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="1500" fill="#f8fafc"/>

  <!-- ============ SECTION 1: ARCHITECTURE ============ -->
  <text x="30" y="40" font-size="22" font-weight="700" fill="#0f172a">1. Component Architecture</text>

  <!-- Internet -->
  <rect x="30" y="65" width="150" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="105" y="95" font-size="14" text-anchor="middle" fill="#0f172a">Internet / Browser</text>

  <!-- Mobile client -->
  <rect x="220" y="65" width="170" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="305" y="88" font-size="13" text-anchor="middle" fill="#0f172a">Non-browser client</text>
  <text x="305" y="104" font-size="11" text-anchor="middle" fill="#475569">(e.g. Immich mobile)</text>

  <!-- App-side nginx boxes -->
  <rect x="60" y="160" width="1180" height="140" rx="10" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="80" y="185" font-size="14" font-weight="700" fill="#3730a3">Per-app nginx (existing infra, untouched except one include)</text>

  <g>
    <rect x="90" y="205" width="220" height="75" rx="8" fill="#ffffff" stroke="#6366f1"/>
    <text x="200" y="230" font-size="13" text-anchor="middle" fill="#1e1b4b" font-weight="600">app1.example.com</text>
    <text x="200" y="248" font-size="11" text-anchor="middle" fill="#4338ca">+ auth-gate.conf</text>
    <text x="200" y="264" font-size="11" text-anchor="middle" fill="#4338ca">auth_request /__otp_verify</text>
  </g>
  <g>
    <rect x="340" y="205" width="220" height="75" rx="8" fill="#ffffff" stroke="#6366f1"/>
    <text x="450" y="230" font-size="13" text-anchor="middle" fill="#1e1b4b" font-weight="600">app2.example.com</text>
    <text x="450" y="248" font-size="11" text-anchor="middle" fill="#4338ca">+ auth-gate.conf</text>
    <text x="450" y="264" font-size="11" text-anchor="middle" fill="#4338ca">auth_request /__otp_verify</text>
  </g>
  <g>
    <rect x="590" y="205" width="220" height="75" rx="8" fill="#ffffff" stroke="#6366f1"/>
    <text x="700" y="230" font-size="13" text-anchor="middle" fill="#1e1b4b" font-weight="600">photos.example.com</text>
    <text x="700" y="248" font-size="11" text-anchor="middle" fill="#4338ca">(Immich) + auth-gate.conf</text>
    <text x="700" y="264" font-size="11" text-anchor="middle" fill="#4338ca">cookie OR device token</text>
  </g>
  <g>
    <rect x="840" y="205" width="220" height="75" rx="8" fill="#ffffff" stroke="#6366f1" stroke-dasharray="4 3"/>
    <text x="950" y="230" font-size="13" text-anchor="middle" fill="#1e1b4b" font-weight="600">auth.example.com</text>
    <text x="950" y="248" font-size="11" text-anchor="middle" fill="#4338ca">login / otp / verify</text>
    <text x="950" y="264" font-size="11" text-anchor="middle" fill="#4338ca">not gated (it IS the gate)</text>
  </g>

  <line x1="105" y1="115" x2="200" y2="205" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="305" y1="115" x2="700" y2="205" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Auth stack container -->
  <rect x="60" y="330" width="1180" height="220" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="80" y="355" font-size="14" font-weight="700" fill="#065f46">Auth stack (docker compose, internal network only)</text>

  <g>
    <rect x="90" y="380" width="260" height="140" rx="8" fill="#ffffff" stroke="#10b981"/>
    <text x="220" y="405" font-size="14" text-anchor="middle" fill="#064e3b" font-weight="700">auth-web (Node)</text>
    <text x="220" y="425" font-size="11" text-anchor="middle" fill="#065f46">GET /login</text>
    <text x="220" y="441" font-size="11" text-anchor="middle" fill="#065f46">POST /otp</text>
    <text x="220" y="457" font-size="11" text-anchor="middle" fill="#065f46">GET /verify (for auth_request)</text>
    <text x="220" y="477" font-size="10" text-anchor="middle" fill="#b91c1c" font-weight="600">holds NO key material</text>
    <text x="220" y="493" font-size="10" text-anchor="middle" fill="#065f46">rate-limit via Redis INCR</text>
    <text x="220" y="509" font-size="10" text-anchor="middle" fill="#065f46">public-facing container</text>
  </g>

  <g>
    <rect x="400" y="380" width="230" height="140" rx="8" fill="#ffffff" stroke="#10b981"/>
    <text x="515" y="405" font-size="14" text-anchor="middle" fill="#064e3b" font-weight="700">Redis</text>
    <text x="515" y="425" font-size="11" text-anchor="middle" fill="#065f46">sessions (cookie -&gt; device_id)</text>
    <text x="515" y="441" font-size="11" text-anchor="middle" fill="#065f46">attempt counters</text>
    <text x="515" y="457" font-size="11" text-anchor="middle" fill="#065f46">(device_id, window) -&gt; count</text>
    <text x="515" y="480" font-size="10" text-anchor="middle" fill="#065f46">ephemeral, no secrets</text>
  </g>

  <g>
    <rect x="670" y="380" width="290" height="140" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="815" y="405" font-size="14" text-anchor="middle" fill="#7f1d1d" font-weight="700">otp-verifier (C++)</text>
    <text x="815" y="425" font-size="11" text-anchor="middle" fill="#7f1d1d">Unix socket only, no network</text>
    <text x="815" y="441" font-size="11" text-anchor="middle" fill="#7f1d1d">HMAC-SHA256, RFC4226, 8 digits</text>
    <text x="815" y="457" font-size="11" text-anchor="middle" fill="#7f1d1d">const-time compare, cleanse key</text>
    <text x="815" y="477" font-size="10" text-anchor="middle" fill="#7f1d1d" font-weight="600">returns {valid:bool} ONLY</text>
    <text x="815" y="493" font-size="10" text-anchor="middle" fill="#7f1d1d" font-weight="600">distroless, non-root, cap-drop=ALL</text>
    <text x="815" y="509" font-size="10" text-anchor="middle" fill="#7f1d1d">no-new-privileges, seccomp</text>
  </g>

  <g>
    <rect x="1000" y="380" width="220" height="140" rx="8" fill="#fffbeb" stroke="#d97706"/>
    <text x="1110" y="405" font-size="14" text-anchor="middle" fill="#78350f" font-weight="700">Keystore</text>
    <text x="1110" y="426" font-size="10" text-anchor="middle" fill="#78350f">/keystore/devices/&lt;ID&gt;/</text>
    <text x="1110" y="442" font-size="10" text-anchor="middle" fill="#78350f">secret (0400)  active (1/0)</text>
    <text x="1110" y="462" font-size="10" text-anchor="middle" fill="#78350f">owned by verifier uid only</text>
    <text x="1110" y="480" font-size="10" text-anchor="middle" fill="#78350f">revoke = flip active flag</text>
    <text x="1110" y="500" font-size="10" text-anchor="middle" fill="#78350f">mounted read-only</text>
  </g>

  <line x1="200" y1="280" x2="220" y2="380" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="280" x2="230" y2="380" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="280" x2="260" y2="380" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="950" y1="280" x2="290" y2="380" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="350" y1="450" x2="400" y2="450" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="375" y="443" font-size="9" text-anchor="middle" fill="#475569">R/W</text>

  <line x1="350" y1="410" x2="670" y2="410" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="510" y="403" font-size="10" text-anchor="middle" fill="#b91c1c" font-weight="600">unix socket: "ID CODE\n" -&gt; "1\n" | "0\n"</text>

  <line x1="960" y1="450" x2="1000" y2="450" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="985" y="443" font-size="9" text-anchor="middle" fill="#b91c1c">read-only</text>

  <text x="80" y="595" font-size="12" fill="#64748b">Trust boundary: only otp-verifier ever reads a secret. auth-web is internet-adjacent and never touches one.</text>
  <line x1="60" y1="610" x2="1240" y2="610" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- ============ SECTION 2: PIPELINE ============ -->
  <text x="30" y="655" font-size="22" font-weight="700" fill="#0f172a">2. Request Pipeline (Model A — gate before login)</text>

  <!-- swimlane headers -->
  <g font-size="12" font-weight="700" fill="#334155">
    <text x="120" y="690" text-anchor="middle">Browser</text>
    <text x="380" y="690" text-anchor="middle">app nginx</text>
    <text x="380" y="704" text-anchor="middle">(app1 / immich)</text>
    <text x="660" y="690" text-anchor="middle">auth-web</text>
    <text x="940" y="690" text-anchor="middle">otp-verifier</text>
    <text x="1160" y="690" text-anchor="middle">Redis</text>
  </g>
  <line x1="120" y1="715" x2="120" y2="1440" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <line x1="380" y1="715" x2="380" y2="1440" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <line x1="660" y1="715" x2="660" y2="1440" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <line x1="940" y1="715" x2="940" y2="1440" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <line x1="1160" y1="715" x2="1160" y2="1440" stroke="#cbd5e1" stroke-dasharray="3 3"/>

  <!-- 1 -->
  <line x1="120" y1="735" x2="380" y2="735" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="728" font-size="11" text-anchor="middle" fill="#334155">1. GET app1.example.com/root</text>

  <!-- 2 internal subrequest -->
  <line x1="380" y1="760" x2="660" y2="760" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="753" font-size="11" text-anchor="middle" fill="#334155">2. auth_request -&gt; GET /verify (Cookie)</text>

  <line x1="660" y1="783" x2="1160" y2="783" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="910" y="776" font-size="11" text-anchor="middle" fill="#334155">3. lookup session</text>
  <line x1="1160" y1="800" x2="660" y2="800" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="910" y="795" font-size="10" text-anchor="middle" fill="#64748b">no session found</text>

  <line x1="660" y1="822" x2="380" y2="822" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="816" font-size="11" text-anchor="middle" fill="#334155">4. 401</text>

  <line x1="380" y1="845" x2="120" y2="845" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="250" y="839" font-size="11" text-anchor="middle" fill="#b91c1c">5. 302 -&gt; auth.example.com/login?redirect=/root</text>

  <rect x="80" y="862" width="600" height="26" rx="6" fill="#fef9c3" stroke="#eab308"/>
  <text x="380" y="879" font-size="11" text-anchor="middle" fill="#713f12">app never rendered anything — unauthenticated traffic saw nothing but a redirect</text>

  <line x1="120" y1="905" x2="660" y2="905" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="899" font-size="11" text-anchor="middle" fill="#334155">6. GET /login -&gt; 200, form (Device ID + 8-digit code)</text>

  <line x1="120" y1="935" x2="660" y2="935" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="929" font-size="11" text-anchor="middle" fill="#334155">7. POST /otp {device_id, code, redirect}</text>

  <line x1="660" y1="958" x2="1160" y2="958" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="910" y="951" font-size="11" text-anchor="middle" fill="#334155">8. INCR attempts(id, window)</text>
  <line x1="1160" y1="975" x2="660" y2="975" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="910" y="970" font-size="10" text-anchor="middle" fill="#64748b">count &lt;= 2, proceed</text>

  <line x1="660" y1="1000" x2="940" y2="1000" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="800" y="993" font-size="11" text-anchor="middle" fill="#b91c1c">9. socket: "DEVICE_ID CODE"</text>

  <rect x="900" y="1015" width="300" height="70" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="1050" y="1032" font-size="10" text-anchor="middle" fill="#7f1d1d">read key (or dummy if unknown)</text>
  <text x="1050" y="1047" font-size="10" text-anchor="middle" fill="#7f1d1d">HMAC for counter -1/0/+1</text>
  <text x="1050" y="1062" font-size="10" text-anchor="middle" fill="#7f1d1d">const-time compare, cleanse key</text>
  <text x="1050" y="1078" font-size="10" text-anchor="middle" fill="#7f1d1d" font-weight="600">-- code never leaves here --</text>

  <line x1="940" y1="1100" x2="660" y2="1100" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="800" y="1093" font-size="11" text-anchor="middle" fill="#b91c1c">10. "1\n" (valid: bool only)</text>

  <line x1="660" y1="1125" x2="1160" y2="1125" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="910" y="1118" font-size="11" text-anchor="middle" fill="#334155">11. SET session:&lt;id&gt; = device_id, EX ttl</text>

  <line x1="660" y1="1150" x2="120" y2="1150" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="1144" font-size="11" text-anchor="middle" fill="#334155">12. 302 -&gt; /root  (Set-Cookie: Domain=.example.com)</text>

  <line x1="120" y1="1180" x2="380" y2="1180" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="1174" font-size="11" text-anchor="middle" fill="#334155">13. GET /root (Cookie now attached)</text>

  <line x1="380" y1="1203" x2="660" y2="1203" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="1197" font-size="11" text-anchor="middle" fill="#334155">14. auth_request -&gt; /verify</text>
  <line x1="660" y1="1223" x2="1160" y2="1223" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1160" y1="1243" x2="660" y2="1243" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="910" y="1237" font-size="10" text-anchor="middle" fill="#166534">session found</text>
  <line x1="660" y1="1263" x2="380" y2="1263" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="1257" font-size="11" text-anchor="middle" fill="#166534">15. 200</text>

  <line x1="380" y1="1290" x2="120" y2="1290" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="1283" font-size="11" text-anchor="middle" fill="#166534" font-weight="700">16. request reaches the app backend, app's OWN login (if any) takes over from here</text>

  <rect x="80" y="1330" width="1140" height="90" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="100" y="1352" font-size="12" font-weight="700" fill="#0f172a">Non-browser client path (e.g. Immich mobile):</text>
  <text x="100" y="1372" font-size="11" fill="#334155">skips steps 1-16 entirely — sends a static per-device header (X-Gateway-Token) on every request instead of a cookie.</text>
  <text x="100" y="1390" font-size="11" fill="#334155">/verify checks header token against Redis in addition to the session cookie. Issued once via the browser flow above, independently revocable.</text>
  <text x="100" y="1408" font-size="11" fill="#b91c1c">Trade-off: this is a standing secret on the device — bounded blast radius (reaches the app's own login, not its data), but not zero-risk.</text>
</svg>

# Local harness. auth-web runs on the Mac itself; nginx runs in Docker and
# reaches it through host.docker.internal.

upstream xauth_web {
    server host.docker.internal:3100;
}

# The login site. Not gated.
server {
    listen 80;
    server_name auth.xauth.test;

    location / {
        proxy_pass http://xauth_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# A gated app, using the exact snippet the server will use.
server {
    listen 80;
    server_name app.xauth.test;

    include /etc/nginx/xauth/xauth-gate.conf;

    location / {
        proxy_pass http://127.0.0.1:8081;
    }

    # Example opt-out, the way a health check would be done.
    location = /health {
        auth_request off;
        default_type text/plain;
        return 200 "app is up (not gated)\n";
    }
}

# An app that is not gated, to see the difference side by side.
server {
    listen 80;
    server_name open.xauth.test;

    location / {
        proxy_pass http://127.0.0.1:8081;
    }
}

# Mock backend standing in for a real app. Same page for every path.
server {
    listen 127.0.0.1:8081;
    root /usr/share/nginx/mock;

    location / {
        try_files /index.html =404;
    }
}

# Anything else, including requests by IP.
server {
    listen 80 default_server;
    return 444;
}

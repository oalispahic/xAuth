<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <title>Sign in · xAuth</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="bar"><span class="bar-name">xAuth</span><span class="bar-sub">access control</span></header>

    <section class="card">
      <h1>Sign in</h1>
      <p class="lede">Enter the ID printed on your keychain and the code on its screen.</p>
      {{{error}}}{{{notice}}}
      <form method="post" action="/otp" class="stack" data-once>
        <input type="hidden" name="redirect" value="{{redirect}}">
        <div class="field">
          <label for="device_id">Device ID</label>
          <input id="device_id" name="device_id" class="mono-id" required maxlength="16"
                 autocomplete="username" autocapitalize="characters" spellcheck="false"
                 placeholder="ABCD" autofocus>
        </div>
        <div class="field">
          <label for="code">Code</label>
          <input id="code" name="code" class="mono-code" required maxlength="16"
                 inputmode="numeric" autocomplete="one-time-code" spellcheck="false"
                 placeholder="0000 0000" data-code>
          <p class="help">A new code every 90 seconds. Two tries per code.</p>
        </div>
        <button type="submit" class="button" data-busy-label="Checking…">Continue</button>
      </form>
    </section>

    <footer class="foot">Authorised keychains only. Every attempt is recorded.</footer>
  </main>
</body>
</html>

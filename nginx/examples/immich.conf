# Immich behind the xAuth gate.
#
# Browsers get the normal login redirect. The Immich mobile app cannot follow
# it, so it sends a device token on every request instead: create one on the
# auth site's signed-in page, then add it in the app under
# Settings -> Advanced -> Custom proxy headers:
#
#     Header name:   X-xAuth-Token
#     Header value:  xat_...
#
# (The menu has moved between Immich versions; look for "custom proxy
# headers".) Immich's own login still applies after the gate.
#
# Needs, once at http level (usually from nginx/auth-site.conf.example):
#     upstream xauth_web { server 127.0.0.1:3100; keepalive 16; }

upstream immich {
    server 127.0.0.1:2283;
    keepalive 16;
}

# WebSocket upgrade, only when the client asks for one.
map $http_upgrade $immich_connection {
    default upgrade;
    ''      '';
}

server {
    listen 443 ssl;
    http2 on;
    server_name photos.example.com;

    ssl_certificate     /etc/letsencrypt/live/photos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photos.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The gate. Server-level, so every location below is covered, including
    # the WebSocket at /api/socket.io and every thumbnail.
    include /etc/nginx/xauth/xauth-gate.conf;

    # Original-quality uploads and videos. The gate's subrequest never carries
    # the body (proxy_pass_request_body off in the snippet), so a multi-GB
    # upload is checked by its headers alone.
    client_max_body_size 50000M;

    location / {
        proxy_pass http://immich;
        proxy_http_version 1.1;

        # The app never needs the xAuth token; keep it out of Immich and its logs.
        proxy_set_header X-xAuth-Token "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $immich_connection;

        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        send_timeout        600s;
        proxy_request_buffering off;
    }

    # Public share links (/share/..., /s/...) are NOT opened here: behind the
    # gate nobody outside can reach them. That is the deliberate choice (see
    # docs/integrations.md). Opening them means `auth_request off;` on those
    # paths AND on the API routes the share page calls, which puts them on
    # the public internet -- do it knowingly, never by pasting a snippet.

    # Optional: an external uptime monitor. Leave commented unless you have one.
    # location = /api/server/ping {
    #     auth_request off;   # WHY: uptime monitor, returns {"res":"pong"} only
    #     proxy_pass http://immich;
    # }
}

server {
    listen 80;
    server_name photos.example.com;
    return 301 https://$host$request_uri;
}

# xAuth gate. Include this inside the `server` block of every app to protect:
#
#     server {
#         server_name photos.example.com;
#         include /etc/nginx/xauth/xauth-gate.conf;
#         location / { proxy_pass http://photos_upstream; }
#     }
#
# Needs `upstream xauth_web { server 127.0.0.1:3100; }` once, at http level.
#
# Server-level on purpose: every location in the server inherits the gate, so a
# location added later is gated by default. Opt a path out with
# `auth_request off;` inside its location (health checks, webhooks), and write
# down why.
#
# The app's own 401s are not affected: error_page only sees upstream responses
# when proxy_intercept_errors is on, which it is not by default. Do not turn it
# on in a gated server, or the app's 401s become redirects to the login page.
#
# Device tokens (for the Immich mobile app and other non-browser clients)
# arrive in the X-xAuth-Token header. The app never needs it; strip it in each
# proxied location so the app, and its logs, never see it:
#
#     location / {
#         proxy_set_header X-xAuth-Token "";
#         proxy_pass http://photos_upstream;
#     }

auth_request /_xauth/verify;
error_page 401 = @xauth_start;

# Gated responses must be revalidated before the browser reuses them. Without
# this, an app that sends cacheable pages (or none at all: browsers cache
# heuristically on Last-Modified) shows its cached page after sign-out, from
# the browser's own cache, without the gate ever being asked. no-cache still
# lets the browser keep the bytes and send If-None-Match; the revalidation
# goes through auth_request like any other request.
#
# nginx quirk: a location with its own add_header does NOT inherit this line.
# Repeat it in any such location of a gated server.
proxy_hide_header Cache-Control;
add_header Cache-Control "private, no-cache" always;

# Session check, called by nginx on every request. `internal` makes it
# unreachable from outside.
location = /_xauth/verify {
    internal;
    auth_request off;
    proxy_method GET;
    proxy_pass http://xauth_web/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-xAuth-Token $http_x_xauth_token;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Never let a cached answer stand in for a live session check.
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}

# No session: hand the original URL to auth-web, which checks it against its
# allowlist, URL-encodes it and redirects to the login page. nginx cannot
# encode it itself, and pasting it raw into ?redirect= breaks on any "&".
location @xauth_start {
    auth_request off;
    # The trailing "?" drops the original query string; it travels in the header.
    rewrite ^ /start? break;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    # $http_host keeps a non-default port, which the dev harness needs. It is
    # client-supplied, so auth-web's exact-match allowlist is what makes it safe.
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://xauth_web;
}
